android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
# This laptop has ~7 GB RAM. The stock 2048M daemon heap leaves almost no headroom
# for D8/workers and OOMs a clean assemble. One worker + 1.5 GB heap fits.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
