apply plugin: 'com.android.application'

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packaging {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
    // Local copy so deploys work on the robot's Wi-Fi with no internet.
    // Only the odometry/geometry classes are used, which need none of FTCLib's
    // Maven dependencies (EJML, core-ktx, Kotlin).
    implementation files('../libs/ftclib-core-2.1.1.aar')
}
